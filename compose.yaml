services:
  app:
    build:
      context: .
      target: development
    ports:
      - '1420:1420'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    init: true
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    command: ['npm', 'run', 'dev', '--', '--host', '0.0.0.0']

volumes:
  node_modules:
