name: Snap de teste

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'snap/**'
      - '.github/workflows/snap.yml'

permissions:
  contents: read

jobs:
  snap:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Gerar Snap amd64
        id: build
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
      - name: Instalar e conferir o CLI dentro do Snap
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          sudo snap install --dangerous "./$(basename "$SNAP_FILE")"
          snap run --shell token-peek -c '"$SNAP/usr/bin/codex" --version && test -x "$SNAP/usr/bin/token-peek"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: token-peek-snap-amd64
          path: ${{ steps.build.outputs.snap }}
