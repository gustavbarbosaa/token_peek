name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm audit
      - name: Preparar Rust e bibliotecas do Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo +stable fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo +stable check --manifest-path src-tauri/Cargo.toml --locked
      - name: Auditar dependências Rust
        run: |
          cargo +stable install cargo-audit --locked --version 0.23.0
          cargo +stable audit --file src-tauri/Cargo.lock
